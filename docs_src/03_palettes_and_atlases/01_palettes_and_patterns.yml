id: A_PALETTES_AND_PATTERNS
title: "Palettes & 88 Built-In Patterns"
summary: "Accessing the 32-color palette and 88 seamless Hero Patterns SVG textures."
track: "03_palettes_and_atlases"
root_module: "PatternMaterialAddon::Docs"
overview: |
  `pattern_material` ships with 88 curated repeating SVG patterns in `addons/pattern_material/textures/patterns/`
  and a 32-color palette in `addons/pattern_material/palette.pal` (and `palette.tres`).
related_sources:
  - "src/resources/palette.cr"
  - "src/resources/patterns.cr"
sections:
  - id: topic_01_palette
    title: "32-Color Palette System"
    summary: "Using named Palette ramps and dynamic color lookup."
    content: |
      The `Palette` class parses `res://addons/pattern_material/palette.pal` (or `palette.tres`) and exposes
      8 color ramps (`gray`, `Maroon`, `red`, `yellow`, `green`, `cyan`, `blue`, `magenta`) with 4 shades each (`1..4`):

      ```crystal
      c1 = Palette.red_3
      c2 = Palette["cyan_4"]
      c3 = Palette[12] # Index lookup (0..31)
      ```

  - id: topic_02_patterns
    title: "88 Seamless Repeating SVG Patterns"
    summary: "Loading cached pattern Texture2D resources by name or random sampling."
    content: |
      `Patterns` provides lazy-loaded, cached access to all 88 built-in SVG patterns:

      ```crystal
      tex = Patterns.get("houndstooth")
      tex2 = Patterns["circuit-board"]
      random_tex = Patterns.sample
      puts Patterns.names.size # => 88
      ```
