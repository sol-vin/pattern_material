id: A_OVERVIEW
title: "Overview & Addon Architecture"
summary: "How pattern_material brings multi-channel pattern replacement, 88 SVG textures, and 14 procedural pattern generators to Godot 4 and Lapis."
track: "01_getting_started"
root_module: "PatternMaterialAddon::Docs"
overview: |
  `pattern_material` is a self-contained Godot 4 and Lapis (Crystal GDExtension) addon that provides a complete
  procedural and asset-driven pattern material pipeline. It includes the 4-channel `pattern_replace.gdshader`
  spatial shader, 88 seamless repeating SVG textures, a 32-color `Palette` parser, spritesheet atlas builders,
  and 14 customizable `PatternGenerator < ImageTexture` classes that rasterize crisp mathematical SVG patterns
  at runtime or in the Godot Editor.
related_sources:
  - "src/pattern_material.cr"
  - "src/resources/universal_material.cr"
  - "addons/pattern_material/shaders/pattern_replace.gdshader"
sections:
  - id: topic_01_installation
    title: "Installation via Lapis CLI"
    summary: "Installing pattern_material into any Lapis or Godot 4 project."
    content: |
      Install `pattern_material` directly from GitHub using the Lapis Addon Package Manager:

      ```bash
      # Install pre-compiled release addon
      lapis install addon github:sol-vin/pattern_material

      # Or install from source and register in shard.yml
      lapis install addon github:sol-vin/pattern_material --source --shard
      ```

      Then require the addon in your Crystal entry point:

      ```crystal
      require "../addons/pattern_material/src/pattern_material"
      # or when installed with --shard:
      require "pattern_material"
      ```

  - id: topic_02_architecture
    title: "Core Subsystems"
    summary: "Summary of the modules and resources included in pattern_material."
    content: |
      The addon is organized into three primary layers:

      1. **Materials & Shader (`UniversalMaterial`, `PatternShaderMaterial`)**: Ergonomic wrappers around `addons/pattern_material/shaders/pattern_replace.gdshader` supporting base patterns, R/G/B/A mask channel replacement, triplanar projection, UV transforms, and surface lighting presets.
      2. **Procedural Pattern Generators (`PatternGenerator < ImageTexture`)**: 14 parametric SVG-backed `ImageTexture` subclasses (`PolkaDotGenerator`, `StripeGenerator`, `CheckerboardGenerator`, `TartanGenerator`, `HoundstoothGenerator`, etc.) plus the interactive `@[Tool] node PatternGeneratorTool < Node3D` inspector preview node.
      3. **Palettes, Patterns & Spritesheet Atlases (`Palette`, `Patterns`, `SpritesheetAtlas`)**: 88 bundled seamless SVG patterns, a 32-color JASC-PAL / Godot `.tres` palette loader, and multi-icon spritesheet builders.
