id: B_UNIVERSAL_MATERIAL
title: "UniversalMaterial & PatternShaderMaterial"
summary: "Creating multi-channel pattern-replacement materials with triplanar mapping, UV transforms, and lighting presets."
track: "01_getting_started"
root_module: "PatternMaterialAddon::Docs"
overview: |
  `UniversalMaterial` (aliased as `PatternMaterial`) and `PatternShaderMaterial` wrap `pattern_replace.gdshader`
  to provide a clean, type-safe API for applying seamless repeating patterns and color palettes to 3D geometry.
related_sources:
  - "src/resources/universal_material.cr"
  - "addons/pattern_material/shaders/pattern_replace.gdshader"
sections:
  - id: topic_01_creating_materials
    title: "Creating a UniversalMaterial"
    summary: "Quickly styling meshes with base colors, patterns, and lighting modes."
    content: |
      `UniversalMaterial.create` returns a ready-to-use `Godot::ShaderMaterial` configured with your choice
      of base color, pattern texture (by name or `Texture2D`/`PatternGenerator`), pattern tint, UV scale,
      and lighting mode (`:lit`, `:unshaded`, `:metallic`, `:shiny`, `:flat`, `:matte`, `:toon`, `:wireframe`):

      ```crystal
      # Using a built-in pattern name and Palette constants
      wall_mat = UniversalMaterial.create(
        base_color: Palette.blue_2,
        pattern: "circuit-board",
        pattern_color: Palette.cyan_4,
        pattern_scale: 8.0_f32,
        mode: :lit
      )
      mesh_instance.material_override = wall_mat
      ```

  - id: topic_02_channel_replacement
    title: "4-Channel R/G/B/A Mask Replacement"
    summary: "Replacing Red, Green, Blue, and Alpha mask channels with independent patterns."
    content: |
      When `use_pattern_replace` is enabled on `UniversalMaterial`, the shader samples `albedo_texture` as an
      R/G/B/A mask and composites up to four independent pattern textures (`pattern_r`, `pattern_g`, `pattern_b`,
      `pattern_a`), each with its own foreground color, background color, UV scale, rotation, offset, and
      triplanar toggle:

      ```crystal
      u = UniversalMaterial.new(base_color: Palette.gray_2, mode: :toon)
      u.use_pattern_replace = true
      u.albedo_texture = mask_texture
      u.set_channel_r("diagonal-stripes", color: Palette.red_3, bg_color: Palette.red_1, scale: 12.0_f32)
      u.set_channel_g("polka-dots", color: Palette.yellow_4, bg_color: Palette.green_2, scale: 16.0_f32)
      mesh_instance.material_override = u.material
      ```
