<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 60 60">
  <!-- Polka Dots (Hero Patterns, Seamless Black & White Tile) -->
  <rect width="60" height="60" fill="#000000" />
  <g><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(20, 0)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(40, 0)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(0, 20)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(20, 20)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(40, 20)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(0, 40)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(20, 40)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
  <g transform="translate(40, 40)"><g fill="#ffffff" fill-rule="evenodd"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="13" r="3"/></g></g>
</svg>
